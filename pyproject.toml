[project]
name = "senselab-poc-starter"
version = "0.1.0"
description = "Runnable examples for a first SenseLab memory experiment: one agent writes a rule, a fresh agent uses it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.5.44 is the first release with AgentMemory.from_env() and working
    # room methods. Every example here depends on one or the other.
    "amfs>=0.5.44",
    "amfs-adapter-http>=0.1.39",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc"]
